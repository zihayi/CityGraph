[package]
name = "citygraph"
version = "0.2.0"
description = "A modern two-dimensional city map creator"
authors = ["CityGraph"]
edition = "2021"

[lib]
name = "citygraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
